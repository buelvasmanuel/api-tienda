# Desarrollo local con Docker: API + MariaDB + Redis, sin instalar Python ni MariaDB.
#   docker compose up --build     → API en http://localhost:8000/docs
#   docker compose down           → la para (los datos se conservan)
#   docker compose down -v        → la para y BORRA los datos (base, modelo, clave)
# Instrucciones completas: INSTRUCCIONES_PROFESOR.md («Opción Docker»).
# Solo para local: las contraseñas de aquí son de ejemplo y ni la base ni
# Redis se publican fuera de Docker (no tienen puerto en el host).

services:
  db:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: tienda_db
      MARIADB_USER: tienda_user
      MARIADB_PASSWORD: tienda_pass_123
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes:
      - datos_db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  # Contadores del límite por IP (LIMITES_URI). En producción van en memoria:
  # aquí, en Redis, para ver cómo se compartirían entre varias instancias.
  # Sin persistencia: al reiniciar, los contadores empiezan de cero (como en memoria).
  redis:
    image: redis:8.2-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: tienda_user
      DB_PASSWORD: tienda_pass_123
      DB_NAME: tienda_db
      # Orígenes explícitos, no "*": con "*" no hay cookies (el refresh en
      # cookie de la web, CONTRATO_AUTH §6.3). Flutter Web en local:
      #   flutter run -d chrome --web-port 8080
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      LIMITES_URI: redis://redis:6379/0
      # Para las passkeys desde Flutter Web en local (CONTRATO_PASSKEYS §5),
      # con la app en http://localhost:<puerto>; cambiar el puerto si hace falta.
      PASSKEYS_RP_ID: localhost
      PASSKEYS_ORIGENES: http://localhost:8080
      # CLAVE_TOKENS no hace falta: se genera la primera vez y se guarda en
      # el volumen "datos_api" (scripts/arranque_docker.py).
    ports:
      # Solo en este ordenador (127.0.0.1). Para probar desde un celular en la
      # misma wifi, cambiar por "8000:8000".
      - "127.0.0.1:8000:8000"
    volumes:
      - datos_api:/datos
      - modelos:/app/modelos
    restart: unless-stopped
    # "healthy" en `docker compose ps` cuando la API responde y ve la base.
    # El primer arranque tarda más: siembra los estudiantes y entrena el modelo.
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  datos_db:
  datos_api:
  modelos:
